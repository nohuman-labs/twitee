services:
  twitee:
    build: .
    image: ghcr.io/nohuman-labs/twitee:local
    restart: unless-stopped
    environment:
      TWITEE_API_KEY: "${TWITEE_API_KEY:?set TWITEE_API_KEY in .env}"
      TWITEE_ENCRYPTION_KEY: "${TWITEE_ENCRYPTION_KEY:?set TWITEE_ENCRYPTION_KEY in .env}"
      TWITEE_NOVNC_URL: "${TWITEE_NOVNC_URL:-http://127.0.0.1:6080}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - twitee-data:/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  twitee-data:
